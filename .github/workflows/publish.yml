name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:

  build:

    permissions:
      contents: write
    
    runs-on: windows-latest

    steps:

      # Checkout codes
      - name: Checkout
        uses: actions/checkout@v7

      # Install the .NET Core workload
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Package portable version
        shell: pwsh
        run: |
          $package = ./scripts/Publish-Portable.ps1
          "release_version=$($package.Directory.Name)" >> $env:GITHUB_ENV
          "release_package=$($package.FullName)" >> $env:GITHUB_ENV

      # Publish to GitHub releases
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.release_package }}
          tag_name: "${{ env.release_version }}"
          generate_release_notes: true
